# Relais de salons : la seule chose que ce jeu heberge.
#
# Il ne connait aucune regle de Tetris. Il reunit les joueurs, impose la graine,
# donne un ordre aux messages et arbitre les eliminations — rien de plus. Toute
# cette logique vit dans src/net/host.js, pure et testee sous `node --test` ; le
# worker ne fait que la brancher sur des WebSockets.

name = "tetris-relais"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Un salon = un Durable Object, nomme d'apres son code. C'est ce qui donne a
# chaque partie son propre espace, sans que les salons se connaissent.
[[durable_objects.bindings]]
name = "SALONS"
class_name = "Salon"

# Le registre, unique : il sait quelles parties ont eu lieu, et dans quel salon.
# Sans lui il faudrait se souvenir du code pour relire un journal.
[[durable_objects.bindings]]
name = "REGISTRE"
class_name = "Registre"

# SQLite plutot que l'ancien stockage : c'est la seule forme de Durable Object
# ouverte au palier gratuit, et elle donne le SQL dont le journal a besoin.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salon"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registre"]

[observability]
enabled = true

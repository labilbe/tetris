<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <canvas id="board" width="300" height="600" aria-label="Plateau de jeu"></canvas>

    <aside class="panel">
      <section class="next">
        <h2>Suivant</h2>
        <canvas id="next" width="120" height="120"></canvas>
      </section>

      <dl class="stats">
        <dt>Score</dt><dd id="score">0</dd>
        <dt>Lignes</dt><dd id="lines">0</dd>
        <dt>Niveau</dt><dd id="level">1</dd>
        <dt class="multi-only" hidden>En jeu</dt><dd class="multi-only" id="remaining" hidden>—</dd>
      </dl>

      <button id="toggle" type="button">Pause</button>

      <label class="option">
        <!-- autocomplete=off : sinon Chrome restaure l'etat coche de la case au
             rechargement et ecrase la preference relue depuis localStorage. -->
        <input type="checkbox" id="ghost" autocomplete="off">
        <span>Projection</span>
      </label>

      <label class="option">
        <input type="checkbox" id="music" autocomplete="off">
        <span>Musique</span>
      </label>

      <section class="help">
        <h2>Commandes</h2>
        <ul>
          <li><kbd>←</kbd> <kbd>→</kbd> déplacer</li>
          <li><kbd>↓</kbd> descente douce</li>
          <li><kbd>↑</kbd> rotation</li>
          <li><kbd>Espace</kbd> chute rapide</li>
          <li><kbd>P</kbd> pause</li>
          <li><kbd>G</kbd> projection</li>
          <li><kbd>M</kbd> musique</li>
        </ul>
      </section>
    </aside>

    <div id="menu" class="overlay menu">
      <h1>Tetris</h1>
      <div class="menu-actions">
        <button type="button" id="play-solo">Partie solo</button>
        <button type="button" id="play-multi">Multijoueur</button>
      </div>
      <p class="menu-note">Le multijoueur réunit deux joueurs sur la même suite de pièces. Il demande le serveur : <code>npm run server</code>.</p>
      <p class="menu-error" id="menu-error" hidden></p>
    </div>

    <div id="waiting" class="overlay menu" hidden>
      <p id="waiting-text"></p>
      <div class="menu-actions">
        <button type="button" id="waiting-begin" hidden>Lancer la partie</button>
        <button type="button" id="waiting-cancel">Retour au menu</button>
      </div>
    </div>

    <div id="overlay" class="overlay" hidden>
      <p id="overlay-text"></p>
      <div class="overlay-actions">
        <button id="resume" type="button">Reprendre</button>
        <button id="restart" type="button">Recommencer</button>
        <button id="to-menu" type="button" hidden>Retour au menu</button>
      </div>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
